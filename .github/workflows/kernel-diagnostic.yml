name: S10+ XNU build

on:
  workflow_dispatch:
    inputs:
      boot_profile:
        description: Storage policy and loader root selection
        type: choice
        options: [diagnostic, userspace]
        default: diagnostic
      component:
        description: Components to build
        type: choice
        options: [all, kernel, firmware, package]
        default: all
      kernel_run:
        description: Successful kernel run ID (package mode only)
        type: string
        default: ''
      firmware_run:
        description: Successful firmware run ID (package mode only)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  B2L_BOOT_PROFILE: ${{ inputs.boot_profile || 'diagnostic' }}

concurrency:
  group: b2l-xnu-${{ inputs.boot_profile || 'diagnostic' }}-${{ inputs.component || 'all' }}
  cancel-in-progress: false

jobs:
  kernel:
    if: inputs.component == 'all' || inputs.component == 'kernel'
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      B2L_KERNEL_ONLY: '1'
      BUILD_JOBS: '2'
      BUILD_MEMORY_BYTES: '6442450944'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Restore pinned build headers
        id: headers
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: b2l-xcode27-kdk25F71-xnuac9718fb-headers-v1
          path: |
            out/ci-env/deps
            out/ci-env/kdk/System/Library/Frameworks
            out/ci-env/kdk/System/Library/KernelSupport
            out/ci-env/kdk/usr
      - name: Prepare pinned kernel dependencies
        shell: bash
        run: |
          mkdir -p out/ci-logs
          set -o pipefail
          bash scripts/ci/kernel.sh prepare 2>&1 | tee out/ci-logs/kernel.log
      - name: Cache verified build headers
        if: steps.headers.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: b2l-xcode27-kdk25F71-xnuac9718fb-headers-v1
          path: |
            out/ci-env/deps
            out/ci-env/kdk/System/Library/Frameworks
            out/ci-env/kdk/System/Library/KernelSupport
            out/ci-env/kdk/usr
      - name: Validate storage boundaries and build XNU
        shell: bash
        run: |
          set -o pipefail
          python3 tests/test_ufs_disk.py xnu --overlay
          python3 tests/test_boot_policy.py xnu
          python3 tests/test_early_console.py xnu
          python3 tests/test_platform_error.py xnu
          python3 tests/test_acpm_diagnostics.py
          python3 tests/test_wifi_diagnostics.py
          python3 tests/test_wifi_gen1.py
          python3 tests/test_wifi_erom.py
          python3 tests/test_fb_timing.py
          python3 tests/test-input-poll.py
          bash scripts/test-native-cache.sh
          python3 tests/test-native-cache-workers.py
          python3 tests/test_native_cache_interactive.py
          bash scripts/test-ufs-transport.sh
          bash scripts/ci/kernel.sh build 2>&1 | tee -a out/ci-logs/kernel.log
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-diagnostics
          path: out/ci-logs/
          retention-days: 7
      - name: Upload standalone kernel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b2l-kernel
          path: out/ci-kernel/
          if-no-files-found: error
          retention-days: 7
  firmware:
    if: inputs.component == 'all' || inputs.component == 'firmware'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      B2L_ENABLE_TOUCH: ${{ inputs.boot_profile == 'userspace' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install firmware build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 llvm-18 lld-18 build-essential uuid-dev nasm acpica-tools python3-venv
      - name: Build firmware for selected profile
        shell: bash
        run: |
          mkdir -p out/ci-logs
          set -o pipefail
          LLVM_MC=/usr/bin/llvm-mc-18 python3 tests/test_cache_fastpaths.py --require-llvm
          bash scripts/ci/firmware.sh 2>&1 | tee out/ci-logs/firmware.log
      - name: Upload firmware reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-diagnostics
          path: out/ci-logs/
          retention-days: 7
      - name: Upload firmware components
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b2l-firmware
          path: out/ci-firmware/
          if-no-files-found: error
          retention-days: 7

  package:
    if: always() && ((inputs.component == 'all' && needs.kernel.result == 'success' && needs.firmware.result == 'success') || inputs.component == 'package')
    needs: [kernel, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: b2l-kernel
          path: out/ci-kernel
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.kernel_run || github.run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: b2l-firmware
          path: out/ci-firmware
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.firmware_run || github.run_id }}
      - name: Check component source compatibility
        shell: bash
        run: |
          [[ "$(cat out/ci-kernel/boot-profile.txt)" == "$B2L_BOOT_PROFILE" ]]
          [[ "$(cat out/ci-firmware/boot-profile.txt)" == "$B2L_BOOT_PROFILE" ]]
          kernel_revision="$(cat out/ci-kernel/source-revision.txt)"
          firmware_revision="$(cat out/ci-firmware/source-revision.txt)"
          [[ "$kernel_revision" =~ ^[0-9a-f]{40}$ && "$firmware_revision" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$kernel_revision" "$firmware_revision"
          git diff --exit-code "$kernel_revision" "$firmware_revision" -- uefi common scripts/package-boot.py
          git diff --exit-code "$kernel_revision" HEAD -- scripts/package-boot.py
      - name: Validate and package BOOT image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 llvm-18
          python3 scripts/package-boot.py \
            --mu out/ci-firmware/mu --firmware out/ci-firmware/firmware.fd \
            --kernel out/ci-kernel/mach.development.b2l --loader out/ci-firmware/XnuLoader.efi \
            --clang /usr/bin/clang-18 --objcopy /usr/bin/llvm-objcopy-18 \
            --output-dir out/diagnostic-boot --max-image-bytes 57671680
          python3 scripts/package-boot.py --verify out/diagnostic-boot/boot.img
          sha256sum out/diagnostic-boot/boot.img > out/diagnostic-boot/SHA256SUMS
          printf '%s\n' "$B2L_BOOT_PROFILE" > out/diagnostic-boot/boot-profile.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s10plus-${{ inputs.boot_profile || 'diagnostic' }}-boot
          path: |
            out/diagnostic-boot/boot.img
            out/diagnostic-boot/manifest.json
            out/diagnostic-boot/SHA256SUMS
            out/diagnostic-boot/boot-profile.txt
          if-no-files-found: error
          retention-days: 7
